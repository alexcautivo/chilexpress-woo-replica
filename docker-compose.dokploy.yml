# Compose para Dokploy (despliegue manual desde GitHub).
# No monta el código desde el host: la imagen ya trae WordPress 7.0.3.
# Persistencia: SQLite + uploads en volúmenes nombrados.
#
# En Dokploy:
#   1. Tipo de aplicación: Docker Compose
#   2. Archivo: docker-compose.dokploy.yml
#   3. Puerto interno: 80
#   4. Env: WP_HOME=https://TU-DOMINIO  (obligatorio)
#   5. CXP_AUTO_LOGIN=0  (recomendado en Internet)
#   6. Pega CXP_API_KEY_GEO / RATE / OT (staging Chilexpress)

name: chilexpress-woo-replica

services:
  wordpress:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.19}
    expose:
      - "80"
    ports:
      - "${WORDPRESS_PORT:-80}:80"
    environment:
      WP_HOME: ${WP_HOME:-http://127.0.0.1}
      WP_SITEURL: ${WP_HOME:-http://127.0.0.1}
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      CXP_AUTO_LOGIN: ${CXP_AUTO_LOGIN:-0}
      CXP_REMOTE_SHOP_URL: ${CXP_REMOTE_SHOP_URL:-}
      CXP_API_KEY_GEO: ${CXP_API_KEY_GEO:-}
      CXP_API_KEY_RATE: ${CXP_API_KEY_RATE:-}
      CXP_API_KEY_OT: ${CXP_API_KEY_OT:-}
      CXP_DOCS_DIR: /var/www/docs
      CXP_INCIDENTS_DIR: /var/www/incidents
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - wp_database:/var/www/html/wp-content/database
      - wp_uploads:/var/www/html/wp-content/uploads
    extra_hosts:
      - "qaservices.wschilexpress.com:135.237.61.242"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  db:
    image: mariadb:11
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wordpress}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wp_database:
  wp_uploads:
  db_data:
