# Alias del compose de Dokploy. Mismo contenido que docker-compose.yml
# (el path por defecto del panel). Cualquiera de los dos archivos sirve.

name: chilexpress-woo-replica

services:
  wordpress:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.19}
    expose:
      - "80"
    environment:
      WP_HOME: ${WP_HOME:-http://chilexpress-woo.5-78-137-25.sslip.io}
      WP_SITEURL: ${WP_HOME:-http://chilexpress-woo.5-78-137-25.sslip.io}
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      CXP_AUTO_LOGIN: ${CXP_AUTO_LOGIN:-0}
      CXP_REMOTE_SHOP_URL: ${CXP_REMOTE_SHOP_URL:-}
      CXP_API_KEY_GEO: ${CXP_API_KEY_GEO:-}
      CXP_API_KEY_RATE: ${CXP_API_KEY_RATE:-}
      CXP_API_KEY_OT: ${CXP_API_KEY_OT:-}
      CXP_DOCS_DIR: /var/www/docs
      CXP_INCIDENTS_DIR: /var/www/incidents
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.chilexpress-woo.rule=Host(`chilexpress-woo.5-78-137-25.sslip.io`)
      - traefik.http.routers.chilexpress-woo.entrypoints=web
      - traefik.http.services.chilexpress-woo.loadbalancer.server.port=80
    volumes:
      - wp_database:/var/www/html/wp-content/database
      - wp_uploads:/var/www/html/wp-content/uploads
      - wp_incidents:/var/www/incidents
    extra_hosts:
      - "qaservices.wschilexpress.com:135.237.61.242"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

  db:
    image: mariadb:11
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wordpress}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wp_database:
  wp_uploads:
  wp_incidents:
  db_data:

networks:
  dokploy-network:
    external: true
