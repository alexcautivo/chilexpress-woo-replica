# Laboratorio local (bind-mount del árbol git).
#   cp .env.example .env
#   docker compose up --build
#
# En Dokploy usa docker-compose.dokploy.yml (imagen autosuficiente + volúmenes).
# MySQL opcional: DB_ENGINE=mysql docker compose --profile mysql up --build

name: chilexpress-woo-replica

services:
  wordpress:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4.19}
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WP_HOME: ${WP_HOME:-http://127.0.0.1:8080}
      WP_SITEURL: ${WP_HOME:-http://127.0.0.1:8080}
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      CXP_AUTO_LOGIN: ${CXP_AUTO_LOGIN:-1}
      CXP_REMOTE_SHOP_URL: ${CXP_REMOTE_SHOP_URL:-}
      CXP_API_KEY_GEO: ${CXP_API_KEY_GEO:-}
      CXP_API_KEY_RATE: ${CXP_API_KEY_RATE:-}
      CXP_API_KEY_OT: ${CXP_API_KEY_OT:-}
      CXP_DOCS_DIR: /var/www/docs
      CXP_INCIDENTS_DIR: /var/www/incidents
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - ./wordpress:/var/www/html
      - ./chilexpress-oficial:/var/www/chilexpress-oficial:ro
      - ./docs:/var/www/docs:ro
      - ./incidents:/var/www/incidents
      - ./baselines:/var/www/baselines:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Docker Desktop a veces no sigue el CNAME de Azure (cURL error 6).
      - "qaservices.wschilexpress.com:135.237.61.242"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  db:
    image: mariadb:11
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wordpress}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  db_data:
