# Laboratorio WooCommerce del auditor (§10–§15).
# Aislado del laboratorio de incidencias: proyecto, red, volumenes y DB propios.
# Versiones fijas por variable de entorno; nunca "latest" (§15).

name: cxp-auditor-woocommerce

services:
  db:
    image: ${AUDITOR_DB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_ROOT_PASSWORD: auditor
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: ${AUDITOR_WP_IMAGE:-wordpress:6.8-php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    ports:
      - "127.0.0.1:${AUDITOR_WP_PORT:-8181}:80"
    volumes:
      - wp_data:/var/www/html
      - ${AUDITOR_ARTIFACT_DIR:-./artifact}:/artifact:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  wpcli:
    image: ${AUDITOR_WPCLI_IMAGE:-wordpress:cli-php8.3}
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # uid 33 no tiene home escribible: sin esto wp-cli no puede cachear.
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - wp_data:/var/www/html
      - ${AUDITOR_ARTIFACT_DIR:-./artifact}:/artifact:ro

volumes:
  db_data:
  wp_data:
